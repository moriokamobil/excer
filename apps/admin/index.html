<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>失われた美術館 — 管理画面</title>
<style>
  :root {
    --bg:#140b26; --card:#1e1338; --muted:#2a1d4a; --purple:#7c4dff;
    --gold:#d4af37; --text:#ede7f6; --dim:#9d8fc0; --danger:#e05a7a; --ok:#66bb9a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Hiragino Sans",sans-serif; }
  header { padding:16px 24px; background:var(--card); border-bottom:1px solid var(--purple);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-family:"Hiragino Mincho ProN",serif; font-size:20px; margin:0; }
  input, select, button { font-size:14px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--muted); background:var(--muted); color:var(--text); }
  button { background:var(--purple); border:none; cursor:pointer; }
  button.gold { background:var(--gold); color:#241a00; }
  button.ghost { background:transparent; border:1px solid var(--purple); }
  nav { display:flex; gap:8px; padding:12px 24px; flex-wrap:wrap; }
  nav button { background:var(--muted); }
  nav button.active { background:var(--purple); }
  main { padding:0 24px 48px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--muted); font-size:13px; }
  th { color:var(--dim); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; background:var(--purple); }
  .badge.danger { background:var(--danger); }
  .badge.ok { background:var(--ok); }
  .dim { color:var(--dim); font-size:12px; }
  .num { width:80px; }
</style>
</head>
<body>
<header>
  <h1>🏛 失われた美術館 — 管理画面</h1>
  <div class="row">
    <input id="apiBase" value="http://localhost:4000/api/v1" size="34" />
    <input id="secret" placeholder="x-admin-secret" value="admin-dev-secret" />
    <button onclick="reloadAll()">接続</button>
  </div>
</header>
<nav>
  <button data-tab="fraud" class="active" onclick="showTab('fraud')">不正レビュー</button>
  <button data-tab="rates" onclick="showTab('rates')">交換レート</button>
  <button data-tab="stores" onclick="showTab('stores')">イベント店</button>
  <button data-tab="pieces" onclick="showTab('pieces')">ピースcrop調整</button>
</nav>
<main id="content"><p class="dim">「接続」を押してデータを読み込みます。</p></main>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts={}) => fetch($('apiBase').value + path, {
  method: opts.method || 'GET',
  headers: { 'content-type':'application/json', 'x-admin-secret': $('secret').value },
  body: opts.body ? JSON.stringify(opts.body) : undefined,
}).then(async r => { const t = await r.text(); const j = t?JSON.parse(t):{}; if(!r.ok) throw new Error(j.error||r.status); return j; });

let tab = 'fraud';
function showTab(t){ tab=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t)); render(); }
function reloadAll(){ render(); }

async function render(){
  const c = $('content');
  c.innerHTML = '<p class="dim">読み込み中…</p>';
  try {
    if (tab==='fraud') return renderFraud(c);
    if (tab==='rates') return renderRates(c);
    if (tab==='stores') return renderStores(c);
    if (tab==='pieces') return renderPieces(c);
  } catch(e){ c.innerHTML = '<p style="color:var(--danger)">エラー: '+e.message+'（API未起動 or シークレット不一致）</p>'; }
}

async function renderFraud(c){
  const { flags } = await api('/admin/fraud-flags');
  const byPlayer = {};
  flags.forEach(f => { (byPlayer[f.playerId] ||= { name:f.curatorName, suspended:f.suspendedUntil, flags:[] }).flags.push(f); });
  let html = '<div class="card"><h2>不正フラグ（'+flags.length+'件）</h2>';
  html += '<p class="dim">fraud_flag 3件で自動サスペンド。レビューして解除できます。</p></div>';
  for (const [pid, p] of Object.entries(byPlayer)) {
    const suspended = p.suspended && new Date(p.suspended) > new Date();
    html += '<div class="card"><div class="row"><b>'+p.name+'</b>'
      + (suspended ? '<span class="badge danger">サスペンド中</span>' : '<span class="badge ok">有効</span>')
      + '<span class="dim">'+p.flags.length+' flags</span>'
      + '<button class="ghost" onclick="clearSusp(\''+pid+'\')">レビュー済み＋解除</button></div>';
    html += '<table><tr><th>理由</th><th>詳細</th><th>日時</th></tr>';
    p.flags.forEach(f => { html += '<tr><td>'+f.reason+'</td><td class="dim">'+JSON.stringify(f.detail).slice(0,80)+'</td><td class="dim">'+new Date(f.createdAt).toLocaleString('ja-JP')+'</td></tr>'; });
    html += '</table></div>';
  }
  if (flags.length===0) html += '<p class="dim">不正フラグはありません。</p>';
  c.innerHTML = html;
}
async function clearSusp(pid){ await api('/admin/players/'+pid+'/clear-suspension',{method:'POST'}); render(); }

async function renderRates(c){
  const { rates } = await api('/admin/exchange-rates');
  let html = '<div class="card"><h2>交換レート</h2><table><tr><th>アイテム</th><th>コイン</th><th>日次上限</th><th>有効</th><th></th></tr>';
  rates.forEach(r => {
    html += '<tr><td>'+r.itemName+'</td>'
      + '<td><input class="num" id="cost_'+r.itemId+'" value="'+r.coinCost+'"></td>'
      + '<td><input class="num" id="cap_'+r.itemId+'" value="'+r.dailyCap+'"></td>'
      + '<td><input type="checkbox" id="en_'+r.itemId+'" '+(r.enabled?'checked':'')+'></td>'
      + '<td><button onclick="saveRate(\''+r.itemId+'\')">保存</button></td></tr>';
  });
  html += '</table></div>';
  c.innerHTML = html;
}
async function saveRate(id){
  await api('/admin/exchange-rates/'+id, { method:'PATCH', body:{
    coinCost:Number($('cost_'+id).value), dailyCap:Number($('cap_'+id).value), enabled:$('en_'+id).checked } });
  render();
}

async function renderStores(c){
  const [{ stores }, { pieces }] = await Promise.all([api('/admin/stores'), api('/admin/pieces')]);
  const mains = pieces.filter(p=>p.pieceType==='main');
  let html = '<div class="card"><h2>イベント店（'+stores.length+'）</h2><table><tr><th>店舗</th><th>配布メインピース</th><th></th></tr>';
  stores.forEach(s => {
    html += '<tr><td>'+s.name+'<div class="dim">'+s.lat.toFixed(4)+', '+s.lng.toFixed(4)+'</div></td>'
      + '<td><select id="mp_'+s.id+'">'
      + mains.map(m=>'<option value="'+m.id+'" '+(m.id===s.mainPieceId?'selected':'')+'>'+m.artworkTitle+' / '+m.name+'</option>').join('')
      + '</select></td>'
      + '<td><button onclick="saveStore(\''+s.id+'\')">保存</button></td></tr>';
  });
  html += '</table></div>';
  c.innerHTML = html;
}
async function saveStore(id){ await api('/admin/stores/'+id, { method:'PATCH', body:{ mainPieceId:$('mp_'+id).value } }); render(); }

async function renderPieces(c){
  const { pieces } = await api('/admin/pieces');
  let html = '<div class="card"><h2>ピースcrop調整（0.0〜1.0）</h2><table><tr><th>名画/ピース</th><th>種別</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th></tr>';
  pieces.forEach(p => {
    html += '<tr><td>'+p.artworkTitle+' / '+p.name+'</td>'
      + '<td><span class="badge">'+p.pieceType+'</span></td>'
      + ['cropX','cropY','cropW','cropH'].map(k=>'<td><input class="num" id="'+k+'_'+p.id+'" value="'+p[k]+'"></td>').join('')
      + '<td><button onclick="savePiece(\''+p.id+'\')">保存</button></td></tr>';
  });
  html += '</table></div>';
  c.innerHTML = html;
}
async function savePiece(id){
  await api('/admin/pieces/'+id, { method:'PATCH', body:{
    cropX:Number($('cropX_'+id).value), cropY:Number($('cropY_'+id).value),
    cropW:Number($('cropW_'+id).value), cropH:Number($('cropH_'+id).value) } });
  render();
}
</script>
</body>
</html>
